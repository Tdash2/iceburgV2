<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videohub Router</title>
    <style>
        :root {
            --bg: #181a1d;
            --panel: #22252a;
            --panel2: #2a2e34;
            --border: #3d4249;
            --text: #f1f3f5;
            --muted: #9aa1aa;
            --accent: #3da5ff;
            --green: #35c759;
            --danger: #ff4d4d;
            --pending: #fff3a3;
            --pendingText: #151515;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .app {
            min-height: 100vh;
            padding-bottom: 92px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 68px;
            background: rgba(24,26,29,.96);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            backdrop-filter: blur(10px);
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .title h1 {
                font-size: 20px;
                margin: 0;
            }

        .device {
            color: var(--muted);
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 9px 14px;
            color: white;
            background: var(--panel2);
            cursor: pointer;
            font-weight: 600;
        }

            button:hover {
                filter: brightness(1.12);
            }

            button:disabled {
                opacity: .5;
                cursor: not-allowed;
            }

        .primary {
            background: var(--accent);
        }

        .success {
            background: var(--green);
        }

        .danger {
            background: var(--danger);
        }

        .content {
            width: min(1250px, calc(100% - 32px));
            margin: 22px auto;
        }

        .notice {
            display: none;
            padding: 11px 14px;
            border-radius: 7px;
            margin-bottom: 16px;
            background: #293d2d;
            border: 1px solid #426d4a;
        }

            .notice.error {
                background: #482729;
                border-color: #774247;
            }

        .card {
            background: var(--panel);
           
            
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 17px;
            border-bottom: 1px solid var(--border);
        }

            .card-header h2 {
                margin: 0;
                font-size: 16px;
            }

        .hint {
            color: var(--muted);
            font-size: 12px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 11px 13px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .output-number {
            width: 80px;
            color: var(--muted);
        }

        .output-name {
            min-width: 190px;
            font-weight: 600;
        }

        .source-cell {
            min-width: 330px;
        }

        .combo {
            position: relative;
        }

        .combo-input {
            width: 100%;
            height: 40px;
            padding: 0 38px 0 12px;
            border: 1px solid var(--border);
           
            outline: none;
            background: #15171a;
            color: var(--text);
            font-size: 14px;
        }

            .combo-input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px rgba(61,165,255,.14);
            }

            .combo-input.pending {
                background: var(--pending);
                color: var(--pendingText);
                border-color: #d8ca67;
            }

        .combo-arrow {
            position: absolute;
            right: 12px;
            top: 11px;
            color: var(--muted);
            pointer-events: none;
        }

        .suggestions {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 4px);
            z-index: 100;
            display: none;
            max-height: 280px;
            overflow-y: auto;
            background: #f7f7f7;
            color: #111;
            border: 1px solid #aaa;
            border-radius: 7px;
            box-shadow: 0 12px 30px rgba(0,0,0,.45);
        }

        .suggestion {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            gap: 10px;
        }

        .suggestion-number {
            color: #777;
            min-width: 28px;
        }

        .suggestion.active,
        .suggestion:hover {
            background: #dbeeff;
        }

        .suggestion-empty {
            padding: 12px;
            color: #777;
        }

        .takebar {
            position: fixed;
            z-index: 60;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(31,34,38,.98);
            border-top: 1px solid var(--border);
            box-shadow: 0 -8px 25px rgba(0,0,0,.25);
        }

        .takebar-inner {
            width: min(1250px, calc(100% - 32px));
            margin: auto;
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .pending-info {
            font-size: 14px;
        }

            .pending-info strong {
                color: var(--pending);
            }

        .take-actions {
            display: flex;
            gap: 8px;
        }

        .names-drawer {
            position: fixed;
            z-index: 80;
            top: 0;
            right: 0;
            width: min(470px, 94vw);
            height: 100vh;
            background: var(--panel);
            border-left: 1px solid var(--border);
            box-shadow: -15px 0 45px rgba(0,0,0,.45);
            transform: translateX(100%);
            transition: transform .22s ease;
            display: flex;
            flex-direction: column;
        }

            .names-drawer.open {
                transform: translateX(0);
            }

        .drawer-header {
            height: 68px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

            .drawer-header h2 {
                margin: 0;
                font-size: 17px;
            }

        .drawer-content {
            padding: 16px;
            overflow-y: auto;
        }

        .search {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: #15171a;
            color: var(--text);
            outline: none;
        }

            .search:focus {
                border-color: var(--accent);
            }

        .name-section {
            margin-bottom: 24px;
        }

            .name-section h3 {
                font-size: 12px;
                color: var(--muted);
                text-transform: uppercase;
                margin: 0 0 8px;
            }

        .name-row {
            display: grid;
            grid-template-columns: 42px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 7px 0;
        }

        .name-number {
            color: var(--muted);
            text-align: center;
        }

        .name-input {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border);
            
            background: #15171a;
            color: var(--text);
            outline: none;
        }

            .name-input:focus {
                border-color: var(--accent);
            }

        .save-name {
            padding: 8px 10px;
            font-size: 12px;
        }

        .overlay {
            position: fixed;
            z-index: 70;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
        }

            .overlay.open {
                display: block;
            }

        @media (max-width: 700px) {
            .header {
                padding: 0 12px;
            }

            .device {
                display: none;
            }

            .content, .takebar-inner {
                width: calc(100% - 20px);
            }

            .hint {
                display: none;
            }

            .output-name {
                min-width: 145px;
            }

            .source-cell {
                min-width: 280px;
            }
        }

        .pending-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
            margin-bottom: 14px;
            padding: 7px 10px;
            background: #292d32;
            border: 1px solid #555b63;
            border-radius: 8px;
            font-size: 12px;
        }

        .pending-summary {
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .pending-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pending);
            display: inline-block;
        }

        .pending-changes {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            white-space: nowrap;
        }

        .pending-chip {
            padding: 4px 7px;
            border-radius: 5px;
            background: var(--pending);
            color: var(--pendingText);
            font-size: 11px;
        }

        .pending-actions {
            display: flex;
            gap: 5px;
            white-space: nowrap;
        }

        .small-button {
            padding: 6px 9px;
            font-size: 11px;
        }

        .name-input.dirty {
            border-color: #e0c84d;
            background: #403b1e;
        }

        .name-row.dirty {
            background: rgba(255,243,163,.06);
            border-radius: 6px;
        }

        .save-name.dirty {
            background: #d8b900;
            color: #111;
        }

        @media (max-width: 700px) {
            .pending-card {
                flex-wrap: wrap;
            }

            .pending-changes {
                order: 3;
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="title">
                <h1 class="routername>Router</h1>
                <span class="device" id="deviceIdLabel"></span>
            </div>

            <div class="actions">
                <button onclick="loadStatus()">Reload Routes</button>
                <button class="primary" onclick="openNames()">Edit Names</button>
            </div>
        </header>

        <main class="content">

            <div id="notice" class="notice"></div>

            <!-- Compact pending changes -->
            <section id="pendingCard" class="pending-card" style="display:none;">
                <div class="pending-summary">
                    <span class="pending-dot"></span>
                    <strong id="pendingCount">0 changes</strong>
                </div>
                <div id="pendingChanges" class="pending-changes"></div>
                <div class="pending-actions">
                    <button class="danger small-button" onclick="cancelAllChanges()">Cancel</button>
                    <button class="success small-button" onclick="takeAllChanges()">Save &amp; TAKE</button>
                </div>
            </section>

            <section class="card">


                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                               
                                <th class="output-name">Router Output</th>
                                <th>Video</th>
                            </tr>
                        </thead>
                        <tbody id="routerBody"></tbody>
                    </table>
                </div>
            </section>

        </main>

    </div>

    <div id="overlay" class="overlay" onclick="closeNames()"></div>

    <aside id="namesDrawer" class="names-drawer">
        <div class="drawer-header">
            <h2>Edit Names</h2>
            <button onclick="closeNames()">✕</button>
        </div>

        <div class="drawer-content">

            <input id="nameSearch"
                   class="search"
                   type="search"
                   placeholder="Search inputs and outputs..."
                   oninput="filterNames()">

            <div class="name-section">
                <h3>Inputs</h3>
                <div id="inputNames"></div>
            </div>

            <div class="name-section">
                <h3>Outputs</h3>
                <div id="outputNames"></div>
            </div>

        </div>
    </aside>


    <script>
        const params = new URLSearchParams(window.location.search);
        const deviceId = params.get("id");

        let deviceInfo = {
            IP: "",
            Name: ""
        };

        async function loadDeviceInfo() {
            try {
                const info = await apiGet(`${apiBase()}/getinfo`);

                deviceInfo = {
                    IP: info.IP || "",
                    Name: info.Name || ""
                };

                const routername = document.getElementById("routername");
                const label = document.getElementById("deviceIdLabel");

                if (deviceInfo.Name && deviceInfo.IP) {
                    label.textContent = `${deviceInfo.Name}`;
                } else if (deviceInfo.Name) {
                    label.textContent = deviceInfo.Name;
                } else if (deviceInfo.IP) {
                    label.textContent = deviceInfo.IP;
                } else {
                    label.textContent = "Router";
                }
            } catch (error) {
                console.error("Unable to load router info:", error);
                document.getElementById("deviceIdLabel").textContent = "Router";
            }
        }

        let inputLabels = {};
        let outputLabels = {};
        let routes = {};
        let pendingRoutes = {};

        function apiBase() {
            return `/api/router/bmd/${encodeURIComponent(deviceId)}`;
        }

        async function apiGet(url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            if (data.error && data.success !== false) {
                throw new Error(data.error);
            }

            return data;
        }

        function showNotice(message, error = false) {
            const notice = document.getElementById("notice");

            notice.textContent = message;
            notice.className = error
                ? "notice error"
                : "notice";

            notice.style.display = "block";

            clearTimeout(showNotice.timer);

            showNotice.timer = setTimeout(() => {
                notice.style.display = "none";
            }, 3500);
        }

        async function loadStatus() {
            if (!deviceId) {
                showNotice(
                    "No router ID. Open the page with ?id=YOUR_DEVICE_ID.",
                    true
                );
                return;
            }

            //try {
                const names = await apiGet(
                    `${apiBase()}/getnames`
                );

                inputLabels = names.input_labels || {};
                outputLabels = names.output_labels || {};

                const routeResult = await apiGet(
                    `${apiBase()}/getroutes`
                );

                routes = routeResult.routes || {};

                buildRouterTable();
                buildNameLists();

                showNotice("Router status updated.");
            
        }

        function sortedKeys(object) {
            return Object.keys(object)
                .map(Number)
                .sort((a, b) => a - b);
        }

        function buildRouterTable() {
            const body = document.getElementById("routerBody");
            body.innerHTML = "";

            const outputs = sortedKeys(outputLabels);

            if (!outputs.length) {
                body.innerHTML =
                    `<tr><td colspan="3">No outputs found.</td></tr>`;
                return;
            }

            for (const output of outputs) {
                const row = document.createElement("tr");

              

                const destination = document.createElement("td");
                destination.className = "output-name";
                destination.textContent =
                    output + 1 + ": "+ outputLabels[output] || `Output ${output + 1}`;

                const source = document.createElement("td");
                source.className = "source-cell";

                const combo = document.createElement("div");
                combo.className = "combo";

                const input = document.createElement("input");
                input.className = "combo-input";
                input.type = "text";
                input.autocomplete = "off";
                input.dataset.output = output;

                let selectedInput;

                if (Object.prototype.hasOwnProperty.call(
                    pendingRoutes, output
                )) {
                    selectedInput = pendingRoutes[output];
                } else {
                    selectedInput = routes[output];
                }

                if (
                    selectedInput !== undefined &&
                    inputLabels[selectedInput] !== undefined
                ) {
                    input.value = inputLabels[selectedInput];
                }

                const arrow = document.createElement("span");
                arrow.className = "combo-arrow";
                arrow.textContent = "▾";

                const suggestions = document.createElement("div");
                suggestions.className = "suggestions";

                combo.appendChild(input);
                combo.appendChild(arrow);
                combo.appendChild(suggestions);
                source.appendChild(combo);

              
                row.appendChild(destination);
                row.appendChild(source);
                body.appendChild(row);

                setupCombobox(input, suggestions, output);
            }
        }

        function setupCombobox(input, suggestions, output) {
            let matches = [];
            let activeIndex = -1;

            function render() {
                const search = input.value.trim().toLowerCase();

                matches = sortedKeys(inputLabels).filter(index => {
                    const name = String(inputLabels[index] || "");
                    return name.toLowerCase().includes(search);
                });

                suggestions.innerHTML = "";

                if (!matches.length) {
                    const empty = document.createElement("div");
                    empty.className = "suggestion-empty";
                    empty.textContent = "No matching inputs";
                    suggestions.appendChild(empty);
                    suggestions.style.display = "block";
                    activeIndex = -1;
                    return;
                }

                if (activeIndex >= matches.length) {
                    activeIndex = matches.length - 1;
                }

                matches.forEach((index, position) => {
                    const item = document.createElement("div");
                    item.className = "suggestion";

                    if (position === activeIndex) {
                        item.classList.add("active");
                    }

                    const number = document.createElement("span");
                    number.className = "suggestion-number";
                    number.textContent = index + 1;

                    const name = document.createElement("span");
                    name.textContent = inputLabels[index];

                    item.appendChild(number);
                    item.appendChild(name);

                    item.addEventListener("mousedown", event => {
                        event.preventDefault();
                        select(index);
                    });

                    suggestions.appendChild(item);
                });

                suggestions.style.display = "block";

                scrollActiveIntoView();
            }

            function scrollActiveIntoView() {
                if (activeIndex < 0) return;

                const item =
                    suggestions.children[activeIndex];

                if (item) {
                    item.scrollIntoView({
                        block: "nearest"
                    });
                }
            }

            function select(index) {
                input.value = inputLabels[index];
                pendingRoutes[output] = index;

                input.classList.add("pending");

                suggestions.style.display = "none";
                activeIndex = -1;

                updatePendingUI();
            }

            input.addEventListener("focus", () => {
                activeIndex = -1;
                render();
            });

            input.addEventListener("input", () => {
                activeIndex = -1;
                render();
            });

            input.addEventListener("keydown", event => {
                if (event.key === "ArrowDown") {
                    event.preventDefault();

                    if (!matches.length) {
                        render();
                        return;
                    }

                    activeIndex =
                        activeIndex < matches.length - 1
                            ? activeIndex + 1
                            : 0;

                    render();
                }

                else if (event.key === "ArrowUp") {
                    event.preventDefault();

                    if (!matches.length) {
                        render();
                        return;
                    }

                    activeIndex =
                        activeIndex > 0
                            ? activeIndex - 1
                            : matches.length - 1;

                    render();
                }

                else if (event.key === "Enter") {
                    event.preventDefault();

                    if (
                        activeIndex >= 0 &&
                        matches[activeIndex] !== undefined
                    ) {
                        select(matches[activeIndex]);
                    }
                    else if (matches.length === 1) {
                        select(matches[0]);
                    }
                }

                else if (event.key === "Escape") {
                    event.preventDefault();
                    suggestions.style.display = "none";
                    activeIndex = -1;
                }
            });

            input.addEventListener("blur", () => {
                setTimeout(() => {
                    suggestions.style.display = "none";
                }, 150);
            });
        }

        let pendingNames = {
            input: {},
            output: {}
        };

        function pendingNameCount() {
            return Object.keys(pendingNames.input).length +
                Object.keys(pendingNames.output).length;
        }

        function totalPendingCount() {
            return Object.keys(pendingRoutes).length +
                pendingNameCount();
        }

        function updatePendingUI() {
            const card = document.getElementById("pendingCard");
            const count = document.getElementById("pendingCount");
            const changes = document.getElementById("pendingChanges");

            const routeCount = Object.keys(pendingRoutes).length;
            const nameCount = pendingNameCount();
            const total = routeCount + nameCount;

            if (total === 0) {
                card.style.display = "none";
                return;
            }

            card.style.display = "flex";

            count.textContent =
                `${total} change${total === 1 ? "" : "s"}`;

            changes.innerHTML = "";

            for (const [output, input] of Object.entries(pendingRoutes)) {
                const chip = document.createElement("span");
                chip.className = "pending-chip";
                chip.textContent =
                    `Route ${Number(output) + 1} → ${inputLabels[input] || `Input ${Number(input) + 1}`}`;
                changes.appendChild(chip);
            }

            for (const [input, name] of Object.entries(pendingNames.input)) {
                const chip = document.createElement("span");
                chip.className = "pending-chip";
                chip.textContent = `Input ${Number(input) + 1}: ${name}`;
                changes.appendChild(chip);
            }

            for (const [output, name] of Object.entries(pendingNames.output)) {
                const chip = document.createElement("span");
                chip.className = "pending-chip";
                chip.textContent = `Output ${Number(output) + 1}: ${name}`;
                changes.appendChild(chip);
            }
        }

        function cancelAllChanges() {
            pendingRoutes = {};
            pendingNames = { input: {}, output: {} };

            buildRouterTable();
            buildNameLists();
            updatePendingUI();
        }

        async function takeAllChanges() {
            const routeChanges = Object.entries(pendingRoutes);
            const inputChanges = Object.entries(pendingNames.input);
            const outputChanges = Object.entries(pendingNames.output);

            if (!routeChanges.length &&
                !inputChanges.length &&
                !outputChanges.length) {
                return;
            }

            try {
                for (const [input, name] of inputChanges) {
                    const result = await apiGet(
                        `${apiBase()}/setinputname/` +
                        `${encodeURIComponent(input)}/` +
                        `${encodeURIComponent(name)}`
                    );

                    if (result.success === false) {
                        throw new Error(
                            result.error || `Input ${Number(input) + 1} name rejected.`
                        );
                    }
                }

                for (const [output, name] of outputChanges) {
                    const result = await apiGet(
                        `${apiBase()}/setoutputname/` +
                        `${encodeURIComponent(output)}/` +
                        `${encodeURIComponent(name)}`
                    );

                    if (result.success === false) {
                        throw new Error(
                            result.error || `Output ${Number(output) + 1} name rejected.`
                        );
                    }
                }

                for (const [output, input] of routeChanges) {
                    const result = await apiGet(
                        `${apiBase()}/setroute/` +
                        `${encodeURIComponent(input)}/` +
                        `${encodeURIComponent(output)}`
                    );

                    if (result.success === false) {
                        throw new Error(
                            result.error || `Route ${Number(output) + 1} rejected.`
                        );
                    }
                }

                pendingRoutes = {};
                pendingNames = { input: {}, output: {} };

                updatePendingUI();
                await loadStatus();

                showNotice("All changes successfully saved.");
            }
            catch (error) {
                console.error(error);
                showNotice(
                    `Error saving changes: ${error.message}`,
                    true
                );
            }
        }

        // Keep the old function name working for Ctrl+Y.
        async function takeRoutes() {
            await takeAllChanges();
        }

        function openNames() {
            document
                .getElementById("namesDrawer")
                .classList.add("open");

            document
                .getElementById("overlay")
                .classList.add("open");

            document.getElementById("nameSearch").focus();
        }

        function closeNames() {
            document
                .getElementById("namesDrawer")
                .classList.remove("open");

            document
                .getElementById("overlay")
                .classList.remove("open");
        }

        function buildNameLists() {
            buildInputNames();
            buildOutputNames();
            filterNames();
        }

        function buildInputNames() {
            const container =
                document.getElementById("inputNames");

            container.innerHTML = "";

            for (const input of sortedKeys(inputLabels)) {
                container.appendChild(
                    createNameRow(
                        "input",
                        input,
                        inputLabels[input]
                    )
                );
            }
        }

        function buildOutputNames() {
            const container =
                document.getElementById("outputNames");

            container.innerHTML = "";

            for (const output of sortedKeys(outputLabels)) {
                container.appendChild(
                    createNameRow(
                        "output",
                        output,
                        outputLabels[output]
                    )
                );
            }
        }


    function createNameRow(type, number, currentName) {
    const row = document.createElement("div");
    row.className = "name-row";

    row.dataset.search =
        `${ number + 1 } ${ currentName } `.toLowerCase();

    const numberElement = document.createElement("div");
    numberElement.className = "name-number";
    numberElement.textContent = number + 1;

    const input = document.createElement("input");
    input.className = "name-input";

    const pendingValue = pendingNames[type][number];

    input.value =
        pendingValue !== undefined
            ? pendingValue
            : (currentName || "");

    if (pendingValue !== undefined) {
        input.classList.add("dirty");
        row.classList.add("dirty");
    }

    const button = document.createElement("button");
    button.className = "save-name";

    button.textContent =
        pendingValue !== undefined
            ? "Pending"
            : "Save";

    if (pendingValue !== undefined) {
        button.classList.add("dirty");
    }

    // Name changes immediately go into the pending queue.
    input.addEventListener("input", () => {
        const name = input.value.trim();
        const original = type === "input"
            ? (inputLabels[number] || "")
            : (outputLabels[number] || "");

        if (!name) {
            delete pendingNames[type][number];

            input.classList.remove("dirty");
            row.classList.remove("dirty");
            button.classList.remove("dirty");
            button.textContent = "Save";

            updatePendingUI();
            return;
        }

        if (name === original) {
            delete pendingNames[type][number];

            input.classList.remove("dirty");
            row.classList.remove("dirty");
            button.classList.remove("dirty");
            button.textContent = "Save";

            updatePendingUI();
            return;
        }

        pendingNames[type][number] = name;

        input.classList.add("dirty");
        row.classList.add("dirty");
        button.classList.add("dirty");
        button.textContent = "Pending";

        updatePendingUI();
    });

    // Keep the button as a visual indication that the change is pending.
    // Clicking it no longer sends anything to the router.
    button.onclick = () => {
        input.focus();
    };

    row.appendChild(numberElement);
    row.appendChild(input);
   // row.appendChild(button);

    return row;
}


// Kept for compatibility if anything else calls saveName().




        function filterNames() {
            const search =
                document.getElementById("nameSearch")
                    .value
                    .trim()
                    .toLowerCase();

            document.querySelectorAll(".name-row")
                .forEach(row => {
                    row.style.display =
                        row.dataset.search.includes(search)
                            ? "grid"
                            : "none";
                });
        }

        function saveName(type, number, input, button) {
            const name = input.value.trim();

            const original =
                type === "input"
                    ? (inputLabels[number] || "")
                    : (outputLabels[number] || "");

            if (name === original) {
                delete pendingNames[type][number];
                input.classList.remove("dirty");
                button.classList.remove("dirty");
                button.textContent = "Save";
                updatePendingUI();
                return;
            }

            if (!name) {
                showNotice("Name cannot be empty.", true);
                return;
            }

            pendingNames[type][number] = name;

            input.classList.add("dirty");
            button.classList.add("dirty");
            button.textContent = "Pending";

            updatePendingUI();
        }

        document.addEventListener("keydown", event => {
            if (
                event.ctrlKey &&
                event.key.toLowerCase() === "y"
            ) {
                event.preventDefault();

                if (Object.keys(pendingRoutes).length) {
                    takeRoutes();
                }
            }

            if (event.key === "Escape") {
                closeNames();
            }
        });

        loadDeviceInfo();
        loadStatus();
    </script>
