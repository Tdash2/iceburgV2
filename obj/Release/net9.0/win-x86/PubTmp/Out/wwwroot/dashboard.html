
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iceburg Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #232323;
            color: white;
        }

        header {
            background: #181818;
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
            .logo-container img {
                
                height: 27px;
                object-fit: contain;
            }

        .logo-text {
            margin-top: 4px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #userInfo {
            font-size: 14px;
            opacity: 0.85;
        }

        .device-card {
            position: relative;
        }

        .device-status {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 28px;
            height: 28px;
        }

        .status-value {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

            .status-value.connected {
                background-color: #2e9d50;
            }

            .status-value.error {
                background-color: #d64545;
                border-radius: 110px;
            }

            .status-value.unknown {
                background-color: #888;
            }
        

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        #userInfo {
            font-size: 14px;
            opacity: 0.85;
        }

        main {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

            .toolbar h2 {
                margin: 0;
            }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        #refreshButton {
            background: #2563eb;
            color: white;
        }

        #logoutButton {
            background: #dc2626;
            color: white;
        }

        #refreshButton:hover {
            background: #1d4ed8;
        }

        #logoutButton:hover {
            background: #b91c1c;
        }

        #status {
            margin-bottom: 20px;
            color: #666;
        }

        #devices {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .device-card {
            position: relative;
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

            .device-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.14);
            }


            .device-card.disabled {
                cursor: default;
                opacity: 0.65;
            }

                .device-card.disabled:hover {
                    transform: none;
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                }

        .device-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .device-info {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
        }

        .device-type {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #e5e7eb;
            color: #374151;
            font-size: 12px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            color: #666;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="Iceburg Log.png" alt="Iceburg Logo">
            <div class="logo-text">Iceburg</div>
        </div>

        <div id="userInfo"></div>
        <button id="logoutButton">Logout</button>
        <button onclick="window.location.href='tallygrid.html';">
            Tally Grid
        </button>
    </header>


    <main>

        <div class="toolbar">
            <h2>Devices</h2>

            <button id="refreshButton">
                Refresh
            </button>
        </div>

        <div id="status">
            Loading devices...
        </div>

        <div id="devices"></div>

    </main>


    <script>



const deviceTypeLookup = {

    "1": {
        name: "BMD Router",
        page: "BMDRouter.html"
    },
    "2": {
        name: "Tally Device",
        page: "tally.html"
    },
    "3": {
        name: "X32 Mixer",
        page: "x32.html"
    },
    "4": {
        name: "AJA FS 4 Or FS HDR",
        page: "ajafs4.html"
    },
    "5": {
        name: "AJA FS 2",
        page: "ajafs2.html"
    },
    


    // Example future devices:
    //
    // "2": {
    //     name: "Audio Device",
    //     page: "AudioDevice.html"
    // },
    //
    // "3": {
    //     name: "Network Device",
    //     page: "NetworkDevice.html"
    // }
};


// ============================================================
// DOM ELEMENTS
// ============================================================

const devicesElement =
    document.getElementById("devices");

const statusElement =
    document.getElementById("status");

const refreshButton =
    document.getElementById("refreshButton");

const logoutButton =
    document.getElementById("logoutButton");

const userInfo =
    document.getElementById("userInfo");


// ============================================================
// LOAD CURRENT USER
// ============================================================

async function loadCurrentUser() {

    try {

        const response =
            await fetch("/api/me", {
                method: "GET",
                credentials: "same-origin"
            });

        if (!response.ok) {

            if (response.status === 401) {
                window.location.replace(
                    "/login.html?returnUrl=" +
                    encodeURIComponent(
                        window.location.pathname +
                        window.location.search
                    )
                );

                return;
            }

            return;
        }

        const user =
            await response.json();

        if (user.username) {

            userInfo.textContent =
                user.username ;
        }

    }
    catch (error) {

        console.error(
            "Unable to load current user:",
            error
        );
    }
}


// ============================================================
// LOAD DEVICES
// ============================================================

        async function loadDevices() {

            // Remember the current scroll position
            const scrollX = window.scrollX;
            const scrollY = window.scrollY;

            try {

                const response =
                    await fetch(
                        "/api/device/getdevices/",
                        {
                            method: "GET",
                            credentials: "same-origin",
                            cache: "no-store"
                        }
                    );


                // --------------------------------------------------------
                // Authentication failure
                // --------------------------------------------------------

                if (response.status === 401) {

                    window.location.replace(
                        "/login.html?returnUrl=" +
                        encodeURIComponent(
                            window.location.pathname +
                            window.location.search
                        )
                    );

                    return;
                }


                // --------------------------------------------------------
                // Permission failure
                // --------------------------------------------------------

                if (response.status === 403) {

                    statusElement.textContent =
                        "You do not have permission to view devices.";

                    return;
                }


                // --------------------------------------------------------
                // Other HTTP errors
                // --------------------------------------------------------

                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const devices =
                    await response.json();


                // --------------------------------------------------------
                // No devices
                // --------------------------------------------------------

                if (!Array.isArray(devices) ||
                    devices.length === 0) {

                    statusElement.textContent = "";

                    devicesElement.innerHTML =
                        `
                <div class="empty">
                    No devices configured.
                </div>
                `;

                    // Restore scroll position
                    window.scrollTo(scrollX, scrollY);

                    return;
                }


                // --------------------------------------------------------
                // Display device count
                // --------------------------------------------------------

                statusElement.textContent =
                    devices.length +
                    " device" +
                    (devices.length === 1
                        ? ""
                        : "s");


                // --------------------------------------------------------
                // Refresh device cards
                // --------------------------------------------------------

                devicesElement.innerHTML = "";

                for (const device of devices) {

                    createDeviceCard(device);
                }


                // --------------------------------------------------------
                // Restore scroll position
                // --------------------------------------------------------

                window.scrollTo(
                    scrollX,
                    scrollY
                );

            }
            catch (error) {

                console.error(
                    "Failed to load devices:",
                    error
                );

                statusElement.textContent = "";

                devicesElement.innerHTML =
                    `
            <div class="error">
                Unable to load devices.
                <br>
                ${escapeHtml(error.message)}
            </div>
            `;

                // Restore scroll position even after an error
                window.scrollTo(scrollX, scrollY);
            }
        }


// ============================================================
// CREATE DEVICE CARD
// ============================================================

 


function createDeviceCard(device) {

    const type =
        String(device.type ?? "");

    const deviceType =
        deviceTypeLookup[type];


    // --------------------------------------------------------
    // Create card
    // --------------------------------------------------------

    const card =
        document.createElement("div");

    card.className =
        "device-card";


    // --------------------------------------------------------
    // Unknown device type
    // --------------------------------------------------------

    if (!deviceType) {

        card.classList.add("disabled");

        card.innerHTML =
            `
            < div class="device-name" >
                ${
                    escapeHtml(
                        device.name || "Unnamed Device"
                    )
        }
            </div >

            <div class="device-info">

                <div>
                    IP:
                    ${escapeHtml(
                        device.ipAddress || "N/A"
                    )}
                </div>

                <div>
                    Device ID:
                    ${escapeHtml(
                        device.id || "N/A"
                    )}
                </div>

                <div class="device-status">
    <span class="status-value unknown">?</span>
</div>

                <span class="device-type">
                    Unknown type: ${escapeHtml(type)}
                </span>

            </div>
        `;

        devicesElement.appendChild(card);

        // Still check status for unknown devices.
        loadDeviceStatus(
            device,
            card
        );

        return;
    }


    // --------------------------------------------------------
    // Known device
    // --------------------------------------------------------

    card.innerHTML =
        `
            <div class="device-name">
                ${escapeHtml( device.name || "Unnamed Device")}
        </div >

        <div class="device-info">

            <div>
                Type:
                ${escapeHtml(deviceType.name)}
            </div>

            <div>
                IP:
                ${escapeHtml(
                    device.ipAddress || "N/A"
                )}
            </div>

                            <div class="device-status">
    <span class="status-value unknown">?</span>
</div>

        </div>

        <span class="device-type">
            Open device
        </span>
        `;


    // --------------------------------------------------------
    // Redirect to device page
    // --------------------------------------------------------

    card.addEventListener(
        "click",
        function () {

            if (!device.id) {
                return;
            }

            const url =
                deviceType.page +
                "?id=" +
                encodeURIComponent(device.id);

            window.location.href = url;
        }
    );


    devicesElement.appendChild(card);


    // --------------------------------------------------------
    // Load status
    // --------------------------------------------------------

    loadDeviceStatus(
        device,
        card
    );
}


// ============================================================
// LOAD DEVICE STATUS
// ============================================================

        async function loadDeviceStatus(device, card) {
            const statusElement = card.querySelector(".status-value");

            if (!statusElement) {
                return;
            }

            try {
                const response = await fetch(
                    `/api/device/getdevicestatus/${encodeURIComponent(device.id)}`,
                    {
                        credentials: "same-origin"
                    }
                );

                if (response.status === 401) {
                    const returnUrl =
                        window.location.pathname + window.location.search;

                    window.location.href =
                        `/login.html?returnUrl=${encodeURIComponent(returnUrl)}`;

                    return;
                }

                if (response.status === 403) {
                    statusElement.textContent = "Forbidden";
                    return;
                }

                if (!response.ok) {
                    statusElement.textContent = "Error";
                    return;
                }

                const status = (await response.text()).trim().toLowerCase();
                if (status === "connected") {
                    statusElement.textContent = "✓";
                    statusElement.className = "status-value connected";
                } else if (status === "error") {
                    statusElement.textContent = "✕";
                    statusElement.className = "status-value error";
                } else {
                    statusElement.textContent = "?";
                    statusElement.className = "status-value unknown";
                }

            } catch (error) {
                console.error(
                    `Failed to get status for device ${device.id}:`,
                    error
                );

                statusElement.textContent = "Error";
                statusElement.className = "status-value error";
            }
        }




// ============================================================
// HTML ESCAPING
// ============================================================
//
// Device names/IP addresses come from the API, so don't inject
// them directly into HTML without escaping.
//
// ============================================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// ============================================================
// REFRESH
// ============================================================

refreshButton.addEventListener(
    "click",
    loadDevices
);


// ============================================================
// LOGOUT
// ============================================================

logoutButton.addEventListener(
    "click",
    async function () {

        try {

            const response =
                await fetch(
                    "/api/logout",
                    {
                        method: "GET",
                        credentials: "same-origin"
                    }
                );


            if (!response.ok) {

                console.error(
                    "Logout failed:",
                    response.status
                );

                return;
            }


            const result =
                await response.json();


            window.location.replace(
                result.redirect ||
                "/login.html"
            );

        }
        catch (error) {

            console.error(
                "Logout error:",
                error
            );

            // The cookie may still have been removed,
            // so send the browser to login anyway.

            window.location.replace(
                "/login.html"
            );
        }
    }
);


// ============================================================
// INITIAL LOAD
// ============================================================

        loadCurrentUser();
        loadDevices();

        // Automatically refresh devices every 5 seconds
        setInterval(loadDevices, 10000);

    </script>

</body>
</html>
