<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartView Control</title>
<script src="header.js"></script>
<style>
body{background:#1e1e1e;color:#eee;font-family:Arial,sans-serif}
h1{color:#4db2ff}
.container{display:block; margin: 30px;}

.monitors{display:flex;flex-direction:row;gap:20px;margin-top:20px;flex-wrap:wrap}
.panel{background:#2b2b2b;padding:15px;border-radius:8px;width:300px;box-sizing:border-box}
label{display:block;margin-top:10px}
input,select{width:100%;color:black;box-sizing:border-box}
.value{float:right;color:#aaa}
#status{color:#aaa}
</style>
</head>
<body>
<div class="container">
  <h1>Blackmagic SmartView Control</h1>
  <p>Device: <strong id="deviceIp">Loading…</strong></p>
  <p id="status" role="status"></p>
  <div class="monitors" id="monitors"></div>
</div>
<script>
const id = new URLSearchParams(location.search).get("id");
const modes = [
  ["Picture","Picture"],["WaveformLuma","Wave Form"],["Vector100","Vector"],
  ["ParadeRGB","Parade RGB"],["ParadeYUV","Parade YUV"],["Histogram","Histogram"],
  ["AudioDbfs","Audio Dbfs"],["AudioDbvu","Audio Dbvu"]
];

function panel(letter, state) {
  const root = document.createElement("section");
  root.className = "panel";
  root.innerHTML = `<h2>Monitor ${letter}</h2>`;
  for (const [param, label] of [["Brightness","Brightness"],["Contrast","Contrast"],["Saturation","Saturation"]]) {
    const wrap = document.createElement("div");
    const value = Number.parseInt(state[param] ?? "128", 10);
    wrap.innerHTML = `<label>${label} <span class="value">${value}</span></label>`;
    const slider = document.createElement("input");
    slider.type = "range"; slider.min = "0"; slider.max = "255";
    slider.value = Number.isFinite(value) ? value : 128;
    slider.addEventListener("input", () => {
      wrap.querySelector(".value").textContent = slider.value;
      send(letter, param, slider.value);
    });
    wrap.appendChild(slider); root.appendChild(wrap);
  }

  const label = document.createElement("label");
  label.textContent = "Scope Mode";
  const select = document.createElement("select");
  for (const [value, text] of modes) {
    const option = document.createElement("option");
    option.value = value; option.textContent = text;
    option.selected = (state.ScopeMode ?? "") === value;
    select.appendChild(option);
  }
  select.addEventListener("change", () => send(letter, "ScopeMode", select.value));
  root.append(label, select);
  return root;
}

async function send(monitor, param, value) {
  try {
    const body = new URLSearchParams({monitor, param, value});
    const response = await fetch(`/api/monitors/bmd/${encodeURIComponent(id)}/set`, {
      method: "POST", headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body
    });
    const result = await response.json();
    document.getElementById("status").textContent =
      result.ok ? "Setting sent" : (result.error || "Command failed");
  } catch (e) {
    document.getElementById("status").textContent = e.message;
  }
}

async function init() {
  if (!id) { document.getElementById("status").textContent = "Missing device id in URL"; return; }
  try {
    const [infoResponse, stateResponse] = await Promise.all([
      fetch(`/api/monitors/bmd/${encodeURIComponent(id)}/getinfo`),
      fetch(`/api/monitors/bmd/${encodeURIComponent(id)}/getstate`)
    ]);
    const info = await infoResponse.json(), state = await stateResponse.json();
    if (info.error || state.error) throw new Error(info.error || state.error);
    document.getElementById("deviceIp").textContent = info.IP;
    const host = document.getElementById("monitors");
    host.replaceChildren(panel("A", state.monitor_a || {}), panel("B", state.monitor_b || {}));
  } catch (e) {
    document.getElementById("status").textContent = e.message;
  }
}
init();
</script>
</body>
</html>
