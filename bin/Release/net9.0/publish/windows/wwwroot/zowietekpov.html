
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZowieCAM Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="header.js"></script>

    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.42857143;
            color: #fff !important;
            background-color: #1e1e1e !important;
        }

        h2 {
            color: #4db2ff !important;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            color: black;
        }

        .container {
            display: block;
            margin: 3%;
        }

        .monitors {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .panel {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            width: 300px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2 id="deviceName">ZowieCAM Controller</h2>

        <br>
        <div class="box" style="
        background: #2d2d2d;
        padding: 10px;
        border-radius: 8px;
    ">

            <!-- SHUTTER -->
            Shutter Speed<br>
            <select style="color: black;" id="shutter"></select>
            <br><br>

            <!-- WHITE BALANCE -->
            White Balance<br>
            <select style="color: black;" id="wb"></select>
            <br>

            <!-- GAIN -->
            <label id="gainLabel">Gain: 10</label>
            <input type="range" id="gain" min="0" max="16" value="10">
            <br>

            <!-- SATURATION -->
            <label id="saturationLabel">Saturation: 50</label>
            <input type="range" id="saturation" min="1" max="100" value="50">
            <br>

            <!-- HUE -->
            <label id="hueLabel">Hue: 0</label>
            <input type="range" id="hue" min="-180" max="180" value="0">
            <br>

            <!-- BRIGHTNESS -->
            <label id="brightnessLabel">Brightness: 4</label>
            <input type="range" id="brightness" min="0" max="8" value="4">
            <br>

            <!-- CONTRAST -->
            <label id="contrastLabel">Contrast: 8</label>
            <input type="range" id="contrast" min="0" max="15" value="8">
            <br>

            <!-- SHARPNESS -->
            <label id="sharpnessLabel">Sharpness: 5</label>
            <input type="range" id="sharpness" min="0" max="10" value="5">
            <br>

        </div>
    </div>

    <script>
        // The device ID is supplied in the page URL, e.g.
        // zowietek-camera.html?id=123
        const params = new URLSearchParams(window.location.search);
        const deviceId = params.get("id");

        if (!deviceId) {
            document.getElementById("deviceName").textContent =
                "Missing device ID — open this page with ?id=DEVICE_ID";
        }

        const apiUrl = "/api/zowietek/camera/" + encodeURIComponent(deviceId || "");
        const infoUrl = "/api/zowietek/getinfo/" + encodeURIComponent(deviceId || "");

        async function loadDeviceInfo() {
            if (!deviceId) return;

            try {
                const response = await fetch(infoUrl, {
                    method: "GET",
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Could not load device information");
                }

                const info = await response.json();

                if (info.Name) {
                    document.getElementById("deviceName").textContent = info.Name;
                }

            } catch (error) {
                console.error("ZowieTEK device info error:", error);
            }
        }
        const sliderNames = [
            "gain",
            "saturation",
            "hue",
            "brightness",
            "contrast",
            "sharpness"
        ];

        let applyTimer = null;
        let requestQueue = Promise.resolve();
        let controlsReady = false;

        function getValue(object, ...names) {
            for (const name of names) {
                if (object && object[name] !== undefined && object[name] !== null) {
                    return object[name];
                }
            }
            return undefined;
        }

        function makeOptions(select, options, selectedValue) {
            select.innerHTML = "";

            if (!Array.isArray(options)) return;

            options.forEach(option => {
                const id = getValue(option, "id", "Id", "value", "Value");
                const name = getValue(option, "name", "Name", "label", "Label");

                const item = document.createElement("option");
                item.value = id ?? name;
                item.textContent = name ?? id;

                if (
                    String(item.value) === String(selectedValue) ||
                    String(name) === String(selectedValue)
                ) {
                    item.selected = true;
                }

                select.appendChild(item);
            });
        }

        function setSlider(name, value) {
            if (value === undefined || value === null) return;

            const slider = document.getElementById(name);
            const label = document.getElementById(name + "Label");

            slider.value = value;
            label.textContent =
                name.charAt(0).toUpperCase() + name.slice(1) + ": " + slider.value;
        }

        async function loadSettings() {
            if (!deviceId) return;

            try {
                const response = await fetch(apiUrl, {
                    method: "GET",
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Could not load camera settings (" + response.status + ")");
                }

                const settings = await response.json();

                const deviceName = getValue(
                    settings, "deviceName", "DeviceName", "name", "Name"
                );

                if (deviceName) {
                    document.getElementById("deviceName").textContent = deviceName;
                }

                const shutterOptions = getValue(
                    settings, "shutterOptions", "ShutterOptions"
                ) || [];

                const wbOptions = getValue(
                    settings,
                    "wbOptions", "WbOptions",
                    "whiteBalanceOptions", "WhiteBalanceOptions"
                ) || [];

                const shutterValue = getValue(
                    settings, "shutter", "Shutter"
                );

                const wbValue = getValue(
                    settings, "wb", "Wb", "whiteBalance", "WhiteBalance"
                );

                makeOptions(
                    document.getElementById("shutter"),
                    shutterOptions,
                    shutterValue
                );

                makeOptions(
                    document.getElementById("wb"),
                    wbOptions,
                    wbValue
                );

                sliderNames.forEach(name => {
                    const value = getValue(
                        settings,
                        name,
                        name.charAt(0).toUpperCase() + name.slice(1)
                    );
                    setSlider(name, value);
                });

                controlsReady = true;

            } catch (error) {
                console.error("ZowieCAM settings error:", error);
                document.getElementById("deviceName").textContent =
                    "Unable to load camera settings";
            }
        }

        function getCameraData() {
            return {
                shutter: document.getElementById("shutter").value,
                wb: document.getElementById("wb").value,
                gain: document.getElementById("gain").value,
                saturation: document.getElementById("saturation").value,
                hue: document.getElementById("hue").value,
                brightness: document.getElementById("brightness").value,
                contrast: document.getElementById("contrast").value,
                sharpness: document.getElementById("sharpness").value
            };
        }

        // Queue requests so rapid slider movements cannot cause older
        // settings to overwrite newer settings.
        function updateCamera() {
            if (!controlsReady || !deviceId) return;

            clearTimeout(applyTimer);

            // Short delay prevents sending a request for every tiny
            // movement while the user is dragging a slider.
            applyTimer = setTimeout(() => {
                const data = getCameraData();

                requestQueue = requestQueue
                    .then(async () => {
                        const response = await fetch(apiUrl, {
                            method: "POST",
                            credentials: "same-origin",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(data)
                        });

                        if (!response.ok) {
                            throw new Error(
                                "Camera update failed (" + response.status + ")"
                            );
                        }
                    })
                    .catch(error => {
                        console.error("ZowieCAM update error:", error);
                    });

            }, 180);
        }

        // Update slider labels and automatically apply changes.
        sliderNames.forEach(name => {
            const slider = document.getElementById(name);
            const label = document.getElementById(name + "Label");

            slider.addEventListener("input", function () {
                label.textContent =
                    name.charAt(0).toUpperCase() + name.slice(1) +
                    ": " + this.value;

                updateCamera();
            });
        });

        // Dropdown changes apply immediately.
        document.getElementById("shutter").addEventListener(
            "change", updateCamera
        );

        document.getElementById("wb").addEventListener(
            "change", updateCamera
        );
        loadDeviceInfo();

        loadSettings();
    </script>

</body>
</html>
