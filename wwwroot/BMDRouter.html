
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Videohub Router</title>

    <style>
        :root {
            --bg: #232323;
            --panel: #373737;
            --panel2: #2a2e34;
            --border: #3d4249;
            --text: #f1f3f5;
            --muted: #9aa1aa;
            --accent: #3da5ff;
            --green: #35c759;
            --danger: #ff4d4d;
            --pending: #fff3a3;
            --pendingText: #151515;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .app {
            min-height: 100vh;
            padding-bottom: 92px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 68px;
            background: rgba(24, 26, 29, .96);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            backdrop-filter: blur(10px);
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px;
        }

            .title h1 {
                font-size: 20px;
                margin: 0;
            }

        .device {
            color: var(--muted);
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 6px 9px;
            color: white;
            background: var(--panel2);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
        }

            button:hover {
                filter: brightness(1.12);
            }

            button:disabled {
                opacity: .5;
                cursor: not-allowed;
            }

        .primary {
            background: var(--accent);
        }

        .success {
            background: var(--green);
        }

        .danger {
            background: var(--danger);
        }

        .content {
            width: min(1250px, calc(100% - 32px));
            margin: 22px auto;
            position: relative;
        }
        .notice {
            position: fixed;
            top: 82px;
            right: 20px;
            z-index: 200;
            display: none;
            padding: 12px 18px;
            background: #293d2d;
            border: 1px solid #426d4a;
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
            pointer-events: none;
            animation: noticeSlideIn .2s ease-out;
        }

        @keyframes noticeSlideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

            .notice.error {
                background: #482729;
                border-color: #774247;
            }




        .card {
            background: var(--panel);
            overflow: hidden;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 11px 13px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .output-name {
            min-width: 190px;
            font-weight: 600;
        }

        .source-cell {
            min-width: 330px;
        }

        .combo {
            position: relative;
        }

        .combo-input {
            width: 100%;
            height: 40px;
            padding: 0 38px 0 12px;
            border: 1px solid var(--border);
            outline: none;
            background: #15171a;
            color: var(--text);
            font-size: 14px;
        }

            .combo-input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px rgba(61, 165, 255, .14);
            }

            .combo-input.pending {
                background: var(--pending);
                color: var(--pendingText);
                border-color: #d8ca67;
            }

        .combo-arrow {
            position: absolute;
            right: 12px;
            top: 11px;

            color: var(--muted);
            pointer-events: none;
        }

        .suggestions {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 4px);
            z-index: 100;
            display: none;
            max-height: 280px;
            overflow-y: auto;
            background: #f7f7f7;
            color: #111;
            border: 1px solid #aaa;
            border-radius: 7px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
        }

        .suggestion {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            gap: 10px;
        }

        .suggestion-number {
            color: #777;
            min-width: 28px;
        }

        .suggestion.active,
        .suggestion:hover {
            background: #dbeeff;
        }

        .suggestion-empty {
            padding: 12px;
            color: #777;
        }

        .pending-card {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 52px;
            margin-bottom: 10px;
            padding: 8px 10px;
            background: #373737;
            font-size: 12px;
        }

        .pending-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .pending-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d6a84f;
            flex-shrink: 0;
        }

        .pending-changes {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow-x: auto;
        }

        .pending-actions {
            display: flex;
            gap: 9px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .small-button {
            padding: 6px 9px;
            font-size: 11px;
        }

        .names-drawer {
            position: fixed;
            z-index: 80;
            top: 0;
            right: 0;
            width: min(470px, 94vw);
            height: 100vh;
            background: var(--panel);
            border-left: 1px solid var(--border);
            box-shadow: -15px 0 45px rgba(0, 0, 0, .45);
            transform: translateX(100%);
            transition: transform .22s ease;
            display: flex;
            flex-direction: column;
        }

            .names-drawer.open {
                transform: translateX(0);
            }

        .drawer-header {
            height: 68px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

            .drawer-header h2 {
                margin: 0;
                font-size: 17px;
            }

        .drawer-content {
            padding: 16px;
            overflow-y: auto;
        }

        .search {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: #15171a;
            color: var(--text);
            outline: none;
        }

            .search:focus {
                border-color: var(--accent);
            }

        .name-section {
            margin-bottom: 24px;
        }

            .name-section h3 {
                font-size: 12px;
                color: var(--muted);
                text-transform: uppercase;
                margin: 0 0 8px;
            }

        .name-row {
            display: grid;
            grid-template-columns: 42px 1fr;
            gap: 8px;
            align-items: center;
            padding: 7px 0;
        }

        .name-number {
            color: var(--muted);
            text-align: center;
        }

        .name-input {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border);
            background: #15171a;
            color: var(--text);
            outline: none;
        }

            .name-input:focus {
                border-color: var(--accent);
            }

            .name-input.dirty {
                border-color: #e0c84d;
                background: #403b1e;
            }

        .name-row.dirty {
            background: rgba(255, 243, 163, .06);
            border-radius: 6px;
        }

        .overlay {
            position: fixed;
            z-index: 70;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
        }

            .overlay.open {
                display: block;
            }

        @media (max-width: 700px) {
            .header {
                padding: 0 12px;
            }

            .device {
                display: none;
            }

            .content {
                width: calc(100% - 20px);
            }

            .output-name {
                min-width: 145px;
            }

            .source-cell {
                min-width: 280px;
            }

            .pending-card {
                flex-wrap: wrap;
            }

            .pending-changes {
                order: 3;
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="app">

      

            


   


        <main class="content">
            <div class="title">
                <h1 id="routername">Router</h1>
                <span class="device" id="deviceIdLabel"></span>
            </div>

            <section id="pendingCard"
                     class="pending-card">

                <div class="pending-summary">

                    <span class="pending-dot" id="pending-dot"></span>

                    <strong id="pendingCount">
                        0 Pending Routes
                    </strong>

                </div>


                <div id="pendingChanges"
                     class="pending-changes">
                </div>


                <div class="pending-actions" id="pending-actions" style="display:none;">

                    <button class="danger small-button"
                            type="button"
                            onclick="cancelAllChanges()">
                        Cancel
                    </button>

                    <button class="success small-button"
                            type="button"
                            onclick="takeAllChanges()">
                        Save &amp; TAKE
                    </button>

                </div>
                <button class="primary"
                        type="button"
                        onclick="openNames()">
                    Edit Names
                </button>

            </section>
            <div id="notice"
                 class="notice">
            </div>


            <!-- Pending changes -->
            <!-- Router table -->
            <section class="card">

                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>
                                <th class="output-name">
                                    Router Output
                                </th>

                                <th>
                                    Video
                                </th>
                            </tr>

                        </thead>


                        <tbody id="routerBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- Drawer overlay -->
    <div id="overlay"
         class="overlay"
         onclick="closeNames()">
    </div>


    <!-- Names drawer -->
    <aside id="namesDrawer"
           class="names-drawer">

        <div class="drawer-header">

            <h2>
                Edit Names
            </h2>

            <button type="button"
                    onclick="closeNames()">
                ✕
            </button>

        </div>


        <div class="drawer-content"
             id="drawerContent">

            <input id="nameSearch"
                   class="search"
                   type="search"
                   placeholder="Search inputs and outputs..."
                   autocomplete="off"
                   oninput="filterNames()">


            <div class="name-section">

                <h3>
                    Inputs
                </h3>

                <div id="inputNames">
                </div>

            </div>


            <div class="name-section">

                <h3>
                    Outputs
                </h3>

                <div id="outputNames">
                </div>

            </div>

        </div>

    </aside>


    <script>

        /*
         * ============================================================
         * CONFIGURATION
         * ============================================================
         */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const deviceId =
            params.get("id");


        /*
         * Refresh every 5 seconds.
         */
        const AUTO_REFRESH_MS = 5000;


        /*
         * ============================================================
         * STATE
         * ============================================================
         */

        let deviceInfo = {
            IP: "",
            Name: ""
        };


        let inputLabels = {};
        let outputLabels = {};
        let routes = {};


        /*
         * These are NEVER replaced by a server refresh.
         *
         * output -> input
         */
        let pendingRoutes = {};


        /*
         * Pending name changes.
         */
        let pendingNames = {
            input: {},
            output: {}
        };


        /*
         * Prevent simultaneous refreshes.
         */
        let refreshInProgress = false;


        /*
         * Prevent automatic refresh while a TAKE operation
         * is actively applying changes.
         */
        let saveInProgress = false;


        /*
         * ============================================================
         * API
         * ============================================================
         */

        function apiBase() {

            return (
                `/api/router/bmd/` +
                encodeURIComponent(deviceId)
            );
        }


        /*
         * Determine whether a URL is login.html.
         */
        function isLoginUrl(url) {

            try {

                const parsed =
                    new URL(
                        url,
                        window.location.href
                    );

                return (
                    parsed.pathname === "/login.html" ||
                    parsed.pathname.endsWith("/login.html")
                );

            }
            catch {
                return false;
            }
        }


        /*
         * Redirect to login while remembering exactly where
         * the user was.
         */
        function redirectToLogin() {

            const returnUrl =
                window.location.href;


            window.location.href =
                `login.html?returnUrl=${encodeURIComponent(returnUrl)
                }`;
        }


        /*
         * ALL HTTP requests use this function.
         */
        async function apiGet(url) {

            let response;


            try {

                response =
                    await fetch(
                        url,
                        {
                            method: "GET",
                            credentials: "same-origin",
                            cache: "no-store",
                            redirect: "follow"
                        }
                    );

            }
            catch (error) {

                throw error;
            }


            /*
             * fetch() follows redirects automatically.
             *
             * If the API sent us to login.html, catch it here.
             */
            if (
                response.redirected &&
                isLoginUrl(response.url)
            ) {

                redirectToLogin();

                throw new Error(
                    "Authentication required."
                );
            }


            /*
             * Also handle a response whose final URL is login.html.
             */
            if (isLoginUrl(response.url)) {

                redirectToLogin();

                throw new Error(
                    "Authentication required."
                );
            }


            /*
             * Some authentication systems return HTML with
             * HTTP 200 instead of a redirect.
             *
             * Inspect Content-Type before trying response.json().
             */
            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";


            if (
                contentType.includes("text/html")
            ) {

                const text =
                    await response.text();


                /*
                 * If the returned HTML looks like the login page,
                 * redirect the browser.
                 */
                if (
                    /login\.html/i.test(text) ||
                    /<title[^>]*login/i.test(text) ||
                    /type=["']password["']/i.test(text)
                ) {

                    redirectToLogin();

                    throw new Error(
                        "Authentication required."
                    );
                }


                throw new Error(
                    "Server returned HTML instead of JSON."
                );
            }


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const data =
                await response.json();


            if (
                data &&
                data.error &&
                data.success !== false
            ) {

                throw new Error(
                    data.error
                );
            }


            return data;
        }


        /*
         * ============================================================
         * NOTICES
         * ============================================================
         */

        function showNotice(
            message,
            error = false
        ) {

            const notice =
                document.getElementById(
                    "notice"
                );


            notice.textContent =
                message;


            notice.className =
                error
                    ? "notice error"
                    : "notice";


            notice.style.display =
                "block";


            clearTimeout(
                showNotice.timer
            );


            showNotice.timer =
                setTimeout(
                    () => {

                        notice.style.display =
                            "none";

                    },
                    3500
                );
        }


        /*
         * ============================================================
         * DEVICE INFO
         * ============================================================
         */

        async function loadDeviceInfo() {

            try {

                const info =
                    await apiGet(
                        `${apiBase()}/getinfo`
                    );


                deviceInfo = {
                    IP: info.IP || "",
                    Name: info.Name || ""
                };


                const routerName =
                    document.getElementById(
                        "routername"
                    );


                const deviceLabel =
                    document.getElementById(
                        "deviceIdLabel"
                    );


                if (deviceInfo.Name) {

                    routerName.textContent =
                        deviceInfo.Name;

                    deviceLabel.textContent =
                        deviceInfo.IP || "";

                }
                else if (deviceInfo.IP) {

                    routerName.textContent =
                        "Router";

                    deviceLabel.textContent =
                        deviceInfo.IP;

                }
                else {

                    routerName.textContent =
                        "Router";

                    deviceLabel.textContent =
                        "";
                }

            }
            catch (error) {

                console.error(
                    "Unable to load router info:",
                    error
                );

            }
        }


        /*
         * ============================================================
         * UI STATE PRESERVATION
         * ============================================================
         */

        function captureUIState() {

            const drawer =
                document.getElementById(
                    "namesDrawer"
                );


            const drawerContent =
                document.getElementById(
                    "drawerContent"
                );


            const search =
                document.getElementById(
                    "nameSearch"
                );


            const state = {

                windowScrollY:
                    window.scrollY,


                drawerOpen:
                    drawer.classList.contains(
                        "open"
                    ),


                drawerScrollTop:
                    drawerContent.scrollTop,


                nameSearch:
                    search.value,


                routeInputs: {},


                focusedRouteOutput:
                    null,


                focusedNameType:
                    null,


                focusedNameNumber:
                    null,


                focusedNameValue:
                    null,


                focusedNameSelectionStart:
                    null,


                focusedNameSelectionEnd:
                    null
            };


            /*
             * Capture every route text box.
             */
            document
                .querySelectorAll(
                    ".combo-input"
                )
                .forEach(input => {

                    const output =
                        input.dataset.output;


                    state.routeInputs[output] = {

                        value:
                            input.value,

                        focused:
                            document.activeElement ===
                            input,

                        selectionStart:
                            input.selectionStart,

                        selectionEnd:
                            input.selectionEnd
                    };


                    if (
                        document.activeElement ===
                        input
                    ) {

                        state.focusedRouteOutput =
                            Number(output);
                    }
                });


            /*
             * Capture focused name editor.
             */
            const active =
                document.activeElement;


            if (
                active &&
                active.classList.contains(
                    "name-input"
                )
            ) {

                const row =
                    active.closest(
                        ".name-row"
                    );


                if (row) {

                    const number =
                        Number(
                            row.dataset.number
                        );


                    const type =
                        row.dataset.type;


                    state.focusedNameType =
                        type;


                    state.focusedNameNumber =
                        number;


                    state.focusedNameValue =
                        active.value;


                    state.focusedNameSelectionStart =
                        active.selectionStart;


                    state.focusedNameSelectionEnd =
                        active.selectionEnd;
                }
            }


            return state;
        }


        function restoreUIState(state) {

            /*
             * Restore name search.
             */
            const search =
                document.getElementById(
                    "nameSearch"
                );


            search.value =
                state.nameSearch || "";


            filterNames();


            /*
             * Restore route input text.
             *
             * NEVER overwrite a pending route.
             */
            document
                .querySelectorAll(
                    ".combo-input"
                )
                .forEach(input => {

                    const output =
                        Number(
                            input.dataset.output
                        );


                    if (
                        Object.prototype.hasOwnProperty.call(
                            pendingRoutes,
                            output
                        )
                    ) {

                        return;
                    }


                    const saved =
                        state.routeInputs[
                        String(output)
                        ];


                    if (!saved) {
                        return;
                    }


                    if (
                        saved.value !== ""
                    ) {

                        input.value =
                            saved.value;
                    }
                });


            /*
             * Restore drawer.
             */
            const drawer =
                document.getElementById(
                    "namesDrawer"
                );


            const overlay =
                document.getElementById(
                    "overlay"
                );


            if (state.drawerOpen) {

                drawer.classList.add(
                    "open"
                );

                overlay.classList.add(
                    "open"
                );

            }
            else {

                drawer.classList.remove(
                    "open"
                );

                overlay.classList.remove(
                    "open"
                );
            }


            /*
             * Wait until the DOM has painted before restoring
             * scroll and focus.
             */
            requestAnimationFrame(
                () => {

                    window.scrollTo(
                        0,
                        state.windowScrollY
                    );


                    const drawerContent =
                        document.getElementById(
                            "drawerContent"
                        );


                    drawerContent.scrollTop =
                        state.drawerScrollTop;


                    /*
                     * Restore route focus.
                     */
                    if (
                        state.focusedRouteOutput !==
                        null
                    ) {

                        const input =
                            document.querySelector(
                                `.combo-input[data-output="${state.focusedRouteOutput}"]`
                            );


                        if (input) {

                            input.focus();


                            const saved =
                                state.routeInputs[
                                String(
                                    state.focusedRouteOutput
                                )
                                ];


                            if (saved) {

                                try {

                                    input.setSelectionRange(
                                        saved.selectionStart,
                                        saved.selectionEnd
                                    );

                                }
                                catch { }
                            }


                            return;
                        }
                    }


                    /*
                     * Restore name focus.
                     */
                    if (
                        state.focusedNameType &&
                        state.focusedNameNumber !== null
                    ) {

                        const container =
                            state.focusedNameType ===
                                "input"
                                ? document.getElementById(
                                    "inputNames"
                                )
                                : document.getElementById(
                                    "outputNames"
                                );


                        const input =
                            container.querySelector(
                                `.name-row[data-number="${state.focusedNameNumber}"] .name-input`
                            );


                        if (input) {

                            input.focus();


                            try {

                                input.setSelectionRange(
                                    state.focusedNameSelectionStart,
                                    state.focusedNameSelectionEnd
                                );

                            }
                            catch { }
                        }
                    }

                }
            );
        }


        /*
         * ============================================================
         * ROUTER STATUS
         * ============================================================
         */

        async function loadStatus(options = {}) {

            const silent = options.silent === true;

            if (!deviceId) {
                showNotice(
                    "No router ID. Open the page with ?id=YOUR_DEVICE_ID.",
                    true
                );
                return;
            }

            if (refreshInProgress || saveInProgress) {
                return;
            }

            refreshInProgress = true;

            const uiState = captureUIState();

            /*
             * IMPORTANT:
             * Only preserve changes that the user has actually made
             * on this page.
             */
            const localPendingRoutes = {
                ...pendingRoutes
            };

            const localPendingNames = {
                input: {
                    ...pendingNames.input
                },
                output: {
                    ...pendingNames.output
                }
            };

            try {

                /*
                 * Get the CURRENT names from the router.
                 */
                const names = await apiGet(
                    `${apiBase()}/getnames`
                );

                inputLabels =
                    names.input_labels || {};

                outputLabels =
                    names.output_labels || {};


                /*
                 * Get the CURRENT routes from the router.
                 *
                 * This is the important part:
                 * every refresh gets a fresh routing table.
                 */
                const routeResult = await apiGet(
                    `${apiBase()}/getroutes`
                );


                /*
                 * Completely replace the live route state.
                 *
                 * This means a routing change made by another
                 * controller/source will appear on the next refresh.
                 */
                routes =
                    routeResult.routes || {};


                console.log(
                    "LIVE ROUTES FROM ROUTER:",
                    routes
                );


                /*
                 * Restore ONLY local changes.
                 *
                 * Anything that isn't pending locally comes directly
                 * from the router.
                 */
                pendingRoutes =
                    localPendingRoutes;

                pendingNames =
                    localPendingNames;


                /*
                 * Rebuild the router display using:
                 *
                 * pending route, if one exists
                 *
                 * otherwise
                 *
                 * live router route
                 */
                buildRouterTable();


                buildNameLists();

                updatePendingUI();


                /*
                 * Restore scroll/focus/drawer/search.
                 */
                restoreUIState(uiState);


                if (!silent) {
                    showNotice("Router status updated.");
                }

            }
            catch (error) {

                console.error(
                    "Router refresh failed:",
                    error
                );

                if (
                    error.message !==
                    "Authentication required."
                ) {

                    if (!silent) {
                        showNotice(
                            `Unable to load router: ${error.message}`,
                            true
                        );
                    }
                }

            }
            finally {

                refreshInProgress = false;
            }
        }


        /*
         * ============================================================
         * ROUTER TABLE
         * ============================================================
         */

        function sortedKeys(object) {

            return Object.keys(object)
                .map(Number)
                .sort(
                    (a, b) => a - b
                );
        }


        function buildRouterTable() {

            const body =
                document.getElementById(
                    "routerBody"
                );

            body.innerHTML = "";


            const outputs =
                sortedKeys(outputLabels);


            if (!outputs.length) {

                body.innerHTML = `
                <tr>
                    <td colspan="2">
                        No outputs found.
                    </td>
                </tr>
            `;

                return;
            }


            for (const output of outputs) {

                const row =
                    document.createElement("tr");


                /*
                 * OUTPUT NAME
                 */
                const destination =
                    document.createElement("td");

                destination.className =
                    "output-name";

                destination.textContent =
                    `${output + 1}: ${outputLabels[output] ||
                    `Output ${output + 1}`
                    }`;


                /*
                 * VIDEO SOURCE
                 */
                const source =
                    document.createElement("td");

                source.className =
                    "source-cell";


                const combo =
                    document.createElement("div");

                combo.className =
                    "combo";


                const input =
                    document.createElement("input");

                input.className =
                    "combo-input";

                input.type =
                    "text";

                input.autocomplete =
                    "off";

                input.spellcheck =
                    false;

                input.dataset.output =
                    String(output);


                /*
                 * ========================================================
                 * THIS IS THE IMPORTANT LOGIC
                 * ========================================================
                 *
                 * If the user has a local pending route:
                 *
                 *     pendingRoutes[output]
                 *
                 * use that.
                 *
                 * Otherwise use:
                 *
                 *     routes[output]
                 *
                 * which came directly from the router.
                 */
                let selectedInput;

                const hasPending =
                    Object.prototype.hasOwnProperty.call(
                        pendingRoutes,
                        output
                    );


                if (hasPending) {

                    selectedInput =
                        Number(
                            pendingRoutes[output]
                        );

                    input.classList.add(
                        "pending"
                    );

                }
                else {

                    selectedInput =
                        Number(
                            routes[output]
                        );
                }


                /*
                 * Display the current source.
                 */
                if (
                    Number.isInteger(selectedInput) &&
                    inputLabels[selectedInput] !== undefined
                ) {

                    input.value =
                        inputLabels[selectedInput];

                }
                else {

                    input.value = "";
                }


                /*
                 * Arrow.
                 */
                const arrow =
                    document.createElement("span");

                arrow.className =
                    "combo-arrow";

                arrow.textContent =
                    "▾";


                /*
                 * Suggestions.
                 */
                const suggestions =
                    document.createElement("div");

                suggestions.className =
                    "suggestions";


                combo.appendChild(input);

                combo.appendChild(arrow);

                combo.appendChild(suggestions);


                source.appendChild(combo);

                row.appendChild(destination);

                row.appendChild(source);

                body.appendChild(row);


                setupCombobox(
                    input,
                    suggestions,
                    output
                );
            }
        }


        /*
         * ============================================================
         * COMBOBOX
         * ============================================================
         */

        function setupCombobox(
            input,
            suggestions,
            output
        ) {

            let matches = [];

            let activeIndex = -1;


            function render() {

                const search =
                    input.value
                        .trim()
                        .toLowerCase();


                matches =
                    sortedKeys(
                        inputLabels
                    )
                        .filter(
                            index => {

                                const name =
                                    String(
                                        inputLabels[
                                        index
                                        ] || ""
                                    );


                                return name
                                    .toLowerCase()
                                    .includes(
                                        search
                                    );
                            }
                        );


                suggestions.innerHTML =
                    "";


                if (!matches.length) {

                    const empty =
                        document.createElement(
                            "div"
                        );


                    empty.className =
                        "suggestion-empty";


                    empty.textContent =
                        "No matching inputs";


                    suggestions.appendChild(
                        empty
                    );


                    suggestions.style.display =
                        "block";


                    activeIndex =
                        -1;


                    return;
                }


                if (
                    activeIndex >=
                    matches.length
                ) {

                    activeIndex =
                        matches.length - 1;
                }


                matches.forEach(
                    (
                        index,
                        position
                    ) => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "suggestion";


                        if (
                            position ===
                            activeIndex
                        ) {

                            item.classList.add(
                                "active"
                            );
                        }


                        const number =
                            document.createElement(
                                "span"
                            );


                        number.className =
                            "suggestion-number";


                        number.textContent =
                            index + 1;


                        const name =
                            document.createElement(
                                "span"
                            );


                        name.textContent =
                            inputLabels[index];


                        item.appendChild(
                            number
                        );


                        item.appendChild(
                            name
                        );


                        item.addEventListener(
                            "mousedown",
                            event => {

                                event.preventDefault();

                                select(
                                    index
                                );
                            }
                        );


                        suggestions.appendChild(
                            item
                        );
                    }
                );


                suggestions.style.display =
                    "block";


                scrollActiveIntoView();
            }


            function scrollActiveIntoView() {

                if (
                    activeIndex < 0
                ) {
                    return;
                }


                const item =
                    suggestions.children[
                    activeIndex
                    ];


                if (item) {

                    item.scrollIntoView({
                        block: "nearest"
                    });
                }
            }


            function select(index) {

                /*
                 * CRITICAL:
                 *
                 * Use numeric output/input indexes.
                 */
                const outputNumber =
                    Number(output);


                const inputNumber =
                    Number(index);


                /*
                 * Display the selected input.
                 */
                input.value =
                    inputLabels[
                    inputNumber
                    ];


                /*
                 * Store the actual pending route.
                 *
                 * output -> input
                 */
                pendingRoutes[
                    outputNumber
                ] =
                    inputNumber;


                console.log(
                    "Pending route:",
                    `Output ${outputNumber + 1}`,
                    "→",
                    `Input ${inputNumber + 1}`
                );


                input.classList.add(
                    "pending"
                );


                suggestions.style.display =
                    "none";


                activeIndex =
                    -1;


                updatePendingUI();
            }


            input.addEventListener(
                "focus",
                () => {

                    activeIndex =
                        -1;

                    render();
                }
            );


            input.addEventListener(
                "input",
                () => {

                    /*
                     * Typing manually does not apply anything.
                     *
                     * The user must select an actual input.
                     */
                    activeIndex =
                        -1;

                    render();
                }
            );


            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "ArrowDown"
                    ) {

                        event.preventDefault();


                        if (!matches.length) {

                            render();

                            return;
                        }


                        activeIndex =
                            activeIndex <
                                matches.length - 1
                                ? activeIndex + 1
                                : 0;


                        render();

                    }

                    else if (
                        event.key ===
                        "ArrowUp"
                    ) {

                        event.preventDefault();


                        if (!matches.length) {

                            render();

                            return;
                        }


                        activeIndex =
                            activeIndex > 0
                                ? activeIndex - 1
                                : matches.length - 1;


                        render();

                    }

                    else if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();


                        if (
                            activeIndex >= 0 &&
                            matches[
                            activeIndex
                            ] !== undefined
                        ) {

                            select(
                                matches[
                                activeIndex
                                ]
                            );

                        }
                        else if (
                            matches.length === 1
                        ) {

                            select(
                                matches[0]
                            );
                        }

                    }

                    else if (
                        event.key ===
                        "Escape"
                    ) {

                        event.preventDefault();


                        suggestions.style.display =
                            "none";


                        activeIndex =
                            -1;
                    }
                }
            );


            input.addEventListener(
                "blur",
                () => {

                    setTimeout(
                        () => {

                            suggestions.style.display =
                                "none";

                        },
                        150
                    );
                }
            );
        }


        /*
         * ============================================================
         * PENDING CHANGES
         * ============================================================
         */

        function pendingNameCount() {

            return (
                Object.keys(
                    pendingNames.input
                ).length +

                Object.keys(
                    pendingNames.output
                ).length
            );
        }


        function totalPendingCount() {

            return (
                Object.keys(
                    pendingRoutes
                ).length +

                pendingNameCount()
            );
        }


        function updatePendingUI() {

            const card = document.getElementById("pending-actions")
            const dot = document.getElementById("pending-dot");


            const count =
                document.getElementById(
                    "pendingCount"
                );


            const changes =
                document.getElementById(
                    "pendingChanges"
                );


            const total =
                totalPendingCount();


            if (total === 0) {

                card.style.display = "none";
                dot.style.background = "#00ff45"    ;

                return;
            }
            card.style.display = "flex";

            dot.style.background = "#d6a84f";


            count.textContent =
                `${total} Pending Routes${total === 1
                    ? ""
                    : "s"
                }`;


            changes.innerHTML =
                "";


            /*
             * Routes.
             */
            for (
                const [
                    output,
                    input
                ]
                of Object.entries(
                    pendingRoutes
                )
            ) {

                const chip =
                    document.createElement(
                        "span"
                    );


                chip.className =
                    "pending-chip";


                chip.textContent =
                    `Route ${Number(output) + 1
                    } → ${inputLabels[
                    Number(input)
                    ] ||
                    `Input ${Number(input) + 1
                    }`
                    }`;


                changes.appendChild(
                    chip
                );
            }


            /*
             * Input names.
             */
            for (
                const [
                    input,
                    name
                ]
                of Object.entries(
                    pendingNames.input
                )
            ) {

                const chip =
                    document.createElement(
                        "span"
                    );


                chip.className =
                    "pending-chip";


                chip.textContent =
                    `Input ${Number(input) + 1
                    }: ${name}`;


                changes.appendChild(
                    chip
                );
            }


            /*
             * Output names.
             */
            for (
                const [
                    output,
                    name
                ]
                of Object.entries(
                    pendingNames.output
                )
            ) {

                const chip =
                    document.createElement(
                        "span"
                    );


                chip.className =
                    "pending-chip";


                chip.textContent =
                    `Output ${Number(output) + 1
                    }: ${name}`;


                changes.appendChild(
                    chip
                );
            }
        }


        function cancelAllChanges() {

            pendingRoutes = {};


            pendingNames = {
                input: {},
                output: {}
            };


            buildRouterTable();

            buildNameLists();

            updatePendingUI();
        }


        /*
         * ============================================================
         * SAVE / TAKE
         * ============================================================
         */

        async function takeAllChanges() {

            /*
             * Take a complete snapshot.
             *
             * Automatic refreshes cannot modify this snapshot.
             */
            const routeChanges =
                Object.entries({
                    ...pendingRoutes
                });


            const inputChanges =
                Object.entries({
                    ...pendingNames.input
                });


            const outputChanges =
                Object.entries({
                    ...pendingNames.output
                });


            if (
                !routeChanges.length &&
                !inputChanges.length &&
                !outputChanges.length
            ) {

                return;
            }


            /*
             * Block auto-refresh while saving.
             */
            saveInProgress =
                true;


            try {

                /*
                 * ----------------------------------------------------
                 * INPUT NAMES
                 * ----------------------------------------------------
                 */
                for (
                    const [
                        input,
                        name
                    ]
                    of inputChanges
                ) {

                    console.log(
                        "Saving input name:",
                        input,
                        name
                    );


                    const result =
                        await apiGet(
                            `${apiBase()}/setinputname/` +
                            `${encodeURIComponent(input)}/` +
                            `${encodeURIComponent(name)}`
                        );


                    if (
                        result.success === false
                    ) {

                        throw new Error(
                            result.error ||
                            `Input ${Number(input) + 1
                            } name rejected.`
                        );
                    }
                }


                /*
                 * ----------------------------------------------------
                 * OUTPUT NAMES
                 * ----------------------------------------------------
                 */
                for (
                    const [
                        output,
                        name
                    ]
                    of outputChanges
                ) {

                    console.log(
                        "Saving output name:",
                        output,
                        name
                    );


                    const result =
                        await apiGet(
                            `${apiBase()}/setoutputname/` +
                            `${encodeURIComponent(output)}/` +
                            `${encodeURIComponent(name)}`
                        );


                    if (
                        result.success === false
                    ) {

                        throw new Error(
                            result.error ||
                            `Output ${Number(output) + 1
                            } name rejected.`
                        );
                    }
                }


                /*
                 * ----------------------------------------------------
                 * ROUTES
                 * ----------------------------------------------------
                 *
                 * The expected API format is:
                 *
                 * /setroute/{input}/{output}
                 *
                 * Example:
                 *
                 * Output 1 -> Input 5
                 *
                 * /setroute/4/0
                 *
                 * because the UI indexes from zero.
                 */
                for (
                    const [
                        output,
                        input
                    ]
                    of routeChanges
                ) {

                    const outputNumber =
                        Number(output);


                    const inputNumber =
                        Number(input);


                    console.log(
                        "APPLYING ROUTE:",
                        {
                            output:
                                outputNumber,
                            input:
                                inputNumber,

                            humanReadable:
                                `Output ${outputNumber + 1
                                } → Input ${inputNumber + 1
                                }`
                        }
                    );


                    const url =
                        `${apiBase()}/setroute/` +
                        `${encodeURIComponent(
                            inputNumber
                        )}/` +
                        `${encodeURIComponent(
                            outputNumber
                        )}`;


                    console.log(
                        "Route request:",
                        url
                    );


                    const result =
                        await apiGet(
                            url
                        );


                    console.log(
                        "Route response:",
                        result
                    );


                    if (
                        result.success === false
                    ) {

                        throw new Error(
                            result.error ||
                            `Route ${outputNumber + 1
                            } rejected.`
                        );
                    }
                }


                /*
                 * ONLY clear changes after EVERY request succeeded.
                 */
                for (
                    const [
                        output
                    ]
                    of routeChanges
                ) {

                    delete pendingRoutes[
                        Number(output)
                    ];
                }


                for (
                    const [
                        input
                    ]
                    of inputChanges
                ) {

                    delete pendingNames.input[
                        Number(input)
                    ];
                }


                for (
                    const [
                        output
                    ]
                    of outputChanges
                ) {

                    delete pendingNames.output[
                        Number(output)
                    ];
                }


                updatePendingUI();


                /*
                 * Now retrieve the actual state from the router.
                 */
                saveInProgress =
                    false;


                await loadStatus({
                    silent: true
                });


                showNotice(
                    "All changes successfully saved."
                );

            }
            catch (error) {

                console.error(
                    "Error applying changes:",
                    error
                );


                /*
                 * DO NOT clear pending changes on failure.
                 */
                if (
                    error.message !==
                    "Authentication required."
                ) {

                    showNotice(
                        `Error saving changes: ${error.message}`,
                        true
                    );
                }

            }
            finally {

                saveInProgress =
                    false;
            }
        }


        /*
         * Compatibility with old Ctrl+Y behavior.
         */
        async function takeRoutes() {

            await takeAllChanges();
        }


        /*
         * ============================================================
         * NAMES DRAWER
         * ============================================================
         */

        function openNames() {

            document
                .getElementById(
                    "namesDrawer"
                )
                .classList.add(
                    "open"
                );


            document
                .getElementById(
                    "overlay"
                )
                .classList.add(
                    "open"
                );


            document
                .getElementById(
                    "nameSearch"
                )
                .focus();
        }


        function closeNames() {

            document
                .getElementById(
                    "namesDrawer"
                )
                .classList.remove(
                    "open"
                );


            document
                .getElementById(
                    "overlay"
                )
                .classList.remove(
                    "open"
                );
        }


        function buildNameLists() {

            buildInputNames();

            buildOutputNames();

            filterNames();
        }


        function buildInputNames() {

            const container =
                document.getElementById(
                    "inputNames"
                );


            container.innerHTML =
                "";


            for (
                const input
                of sortedKeys(
                    inputLabels
                )
            ) {

                container.appendChild(
                    createNameRow(
                        "input",
                        input,
                        inputLabels[input]
                    )
                );
            }
        }


        function buildOutputNames() {

            const container =
                document.getElementById(
                    "outputNames"
                );


            container.innerHTML =
                "";


            for (
                const output
                of sortedKeys(
                    outputLabels
                )
            ) {

                container.appendChild(
                    createNameRow(
                        "output",
                        output,
                        outputLabels[output]
                    )
                );
            }
        }


        function createNameRow(
            type,
            number,
            currentName
        ) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "name-row";


            row.dataset.type =
                type;


            row.dataset.number =
                String(number);


            row.dataset.search =
                `${number + 1} ${currentName || ""
                    }`.toLowerCase();


            const numberElement =
                document.createElement(
                    "div"
                );


            numberElement.className =
                "name-number";


            numberElement.textContent =
                number + 1;


            const input =
                document.createElement(
                    "input"
                );


            input.className =
                "name-input";


            input.type =
                "text";


            input.autocomplete =
                "off";


            const pendingValue =
                pendingNames[
                type
                ][number];


            input.value =
                pendingValue !== undefined
                    ? pendingValue
                    : (
                        currentName ||
                        ""
                    );


            if (
                pendingValue !== undefined
            ) {

                input.classList.add(
                    "dirty"
                );

                row.classList.add(
                    "dirty"
                );
            }


            input.addEventListener(
                "input",
                () => {

                    const name =
                        input.value.trim();


                    const original =
                        type === "input"
                            ? (
                                inputLabels[
                                number
                                ] || ""
                            )
                            : (
                                outputLabels[
                                number
                                ] || ""
                            );


                    /*
                     * Empty means no pending change.
                     */
                    if (!name) {

                        delete pendingNames[
                            type
                        ][number];


                        input.classList.remove(
                            "dirty"
                        );


                        row.classList.remove(
                            "dirty"
                        );


                        updatePendingUI();

                        return;
                    }


                    /*
                     * Same as router state means no pending change.
                     */
                    if (
                        name === original
                    ) {

                        delete pendingNames[
                            type
                        ][number];


                        input.classList.remove(
                            "dirty"
                        );


                        row.classList.remove(
                            "dirty"
                        );


                        updatePendingUI();

                        return;
                    }


                    /*
                     * Store pending name.
                     */
                    pendingNames[
                        type
                    ][number] =
                        name;


                    input.classList.add(
                        "dirty"
                    );


                    row.classList.add(
                        "dirty"
                    );


                    updatePendingUI();
                }
            );


            row.appendChild(
                numberElement
            );


            row.appendChild(
                input
            );


            return row;
        }


        function filterNames() {

            const search =
                document
                    .getElementById(
                        "nameSearch"
                    )
                    .value
                    .trim()
                    .toLowerCase();


            document
                .querySelectorAll(
                    ".name-row"
                )
                .forEach(
                    row => {

                        row.style.display =
                            row.dataset.search
                                .includes(
                                    search
                                )
                                ? "grid"
                                : "none";
                    }
                );
        }


        /*
         * ============================================================
         * KEYBOARD SHORTCUTS
         * ============================================================
         */

        document.addEventListener(
            "keydown",
            event => {

                /*
                 * Ctrl+Y = Save & TAKE.
                 */
                if (
                    event.ctrlKey &&
                    event.key.toLowerCase() === "y"
                ) {

                    event.preventDefault();

                    if (
                        totalPendingCount() > 0
                    ) {

                        takeAllChanges();
                    }
                }


                /*
                 * Escape closes drawer.
                 */
                if (
                    event.key === "Escape"
                ) {

                    closeNames();
                }
            }
        );


        /*
         * ============================================================
         * AUTOMATIC REFRESH
         * ============================================================
         */

        async function autoRefresh() {

            /*
             * Don't refresh while saving.
             */
            if (
                !saveInProgress &&
                !refreshInProgress
            ) {

                await loadStatus({
                    silent: true
                });
            }


            /*
             * Schedule the NEXT refresh only after this one
             * has completed.
             *
             * This prevents overlapping requests.
             */
            setTimeout(
                autoRefresh,
                AUTO_REFRESH_MS
            );
        }


        /*
         * ============================================================
         * START
         * ============================================================
         */

        (async function start() {

            await loadDeviceInfo();

            await loadStatus();

            /*
             * Start automatic refresh after initial load.
             */


        })();

    </script>
